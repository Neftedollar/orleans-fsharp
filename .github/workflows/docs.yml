name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'scripts/check-current-docs-api.py'
      - 'scripts/check-deprecation-signal.py'
      - 'scripts/check-docs-links.py'
      - 'scripts/check-docs-mirror.py'
      - 'scripts/generate-llms-full.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check documentation invariants
        run: |
          python3 scripts/check-deprecation-signal.py
          python3 scripts/check-docs-mirror.py
          python3 scripts/check-current-docs-api.py
          python3 scripts/generate-llms-full.py --check
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install and build
        working-directory: website
        run: |
          npm ci
          npm audit --audit-level=low
          npm run build
      - name: Check built-site link invariants
        run: python3 scripts/check-docs-links.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
